name: Deploy Ionic React Vite (Docker) to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node (optional if Docker builds everything)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies and run type checks (optional)
      - name: Install dependencies
        run: npm install

      # 4️⃣ Generate timestamp for EB version label
      - name: Generate timestamp
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      # 5️⃣ Zip only the files needed for Docker deployment
      - name: Zip application for Elastic Beanstalk
        run: |
          rm -f app.zip
          zip -r app.zip Dockerfile nginx.conf package*.json public/ src/ -x "*.git*" -x "node_modules/*" -x "*.github/*"

      # 6️⃣ Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: twitter-clone-front
          environment_name: twitter-clone-front
          region: eu-north-1
          version_label: ${{ github.sha }}-${{ env.TIMESTAMP }}
          deployment_package: app.zip
          wait_for_deployment: true
